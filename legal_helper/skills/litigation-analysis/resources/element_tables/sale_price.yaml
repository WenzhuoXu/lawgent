# 买卖合同纠纷（出卖人请求支付价款）— seller's claim for the price.
# Pinpoints checked 2026-10-07 against the 民法典 text at court.gov.cn and the
# 买卖合同解释 as amended by 法释〔2020〕17号 (articles renumbered in 2020).
# Re-verify every pinpoint via pkulaw_fatiao before use (README rule).
# Buyer's own claims (质量违约、迟延交付) are decomposed from 第六百一十七条 /
# 第五百七十七条 — use contract_breach for those.
name: sale_price
display_name: 买卖合同之诉（货款）/ Sale of goods — claim for the price
cause_of_action: 买卖合同纠纷
legal_basis:
  - source: 《中华人民共和国民法典》
    pinpoint: 第五百七十九条
  - source: 《中华人民共和国民法典》
    pinpoint: 第六百二十六条
elements:
  - id: valid_sale_contract
    element_zh: 买卖合同依法成立并生效
    element_en: A sale contract was validly formed and in effect
    burden: claimant
    evidence_hints: [合同文本, 订单/确认函, 交易往来与履行行为, 交易习惯]
    authority:
      - source: 《中华人民共和国民法典》
        pinpoint: 第五百九十五条
      - source: 《中华人民共和国民法典》
        pinpoint: 第五百零二条
  - id: delivery
    element_zh: 出卖人已交付标的物或者提取标的物的单证
    element_en: Seller delivered the goods or the documents of title
    burden: claimant
    evidence_hints: [送货单签收, 物流/签收记录, 验收单, 提单/仓单]
    authority:
      - source: 《中华人民共和国民法典》
        pinpoint: 第五百九十八条
  - id: price_amount
    element_zh: 价款数额已约定，或者依补充协议、交易习惯、市场价格可以确定
    element_en: The price is agreed or determinable (supplement, usage, market price)
    burden: claimant
    evidence_hints: [单价与数量条款, 对账单, 发票, 结算确认]
    authority:
      - source: 《中华人民共和国民法典》
        pinpoint: 第六百二十六条
      - source: 《中华人民共和国民法典》
        pinpoint: 第五百一十一条
  - id: payment_due
    element_zh: 付款期限已届至（未约定或约定不明且无法补充确定的，于收到标的物或提取单证时付款）
    element_en: Payment has fallen due (default — on receipt of goods or documents)
    burden: claimant
    evidence_hints: [付款期限条款, 交付时间证据, 催款函]
    authority:
      - source: 《中华人民共和国民法典》
        pinpoint: 第六百二十八条
  - id: late_payment_loss
    element_zh: 主张逾期付款违约金或损失的：有约定按约定；无约定的，以违约行为发生时一年期LPR为基础加计30%—50%计算逾期付款损失
    element_en: Late-payment damages — the agreed penalty, else one-year LPR plus 30–50%
    burden: claimant
    evidence_hints: [违约金条款, 逾期天数计算表, 违约行为发生时的LPR]
    authority:
      - source: 《中华人民共和国民法典》
        pinpoint: 第五百八十五条
      - source: 《最高人民法院关于审理买卖合同纠纷案件适用法律问题的解释》
        pinpoint: 第十八条第四款
defenses:
  - id: simultaneous_performance
    element_zh: 双方互负债务且无先后履行顺序，出卖人未履行或履行不符合约定
    element_en: Concurrent obligations — seller has not performed (or not conformingly)
    burden: respondent
    stage: exercisable
    evidence_hints: [合同履行顺序条款, 未交付/部分交付证据]
    authority:
      - source: 《中华人民共和国民法典》
        pinpoint: 第五百二十五条
  - id: prior_performance
    element_zh: 依约出卖人应先履行而未履行或履行不符合约定
    element_en: Seller was to perform first and did not (or not conformingly)
    burden: respondent
    stage: exercisable
    evidence_hints: [先履行条款, 交付时间与付款时间对照]
    authority:
      - source: 《中华人民共和国民法典》
        pinpoint: 第五百二十六条
  - id: quality_nonconformity
    element_zh: 标的物质量或数量不符合约定，且买受人已在检验期限或合理期限内通知出卖人（自收货起二年内，有质量保证期的适用质量保证期；出卖人明知或应知不符的不受通知期限限制），据此请求减少价款
    element_en: Goods nonconforming and notified in time (inspection / reasonable period, two-year cap) — price reduction
    burden: respondent
    stage: quantum
    evidence_hints: [检验报告, 质量异议通知及送达证据, 鉴定意见, 质量保证期条款]
    authority:
      - source: 《中华人民共和国民法典》
        pinpoint: 第六百一十七条
      - source: 《中华人民共和国民法典》
        pinpoint: 第六百二十一条
      - source: 《中华人民共和国民法典》
        pinpoint: 第五百八十二条
  - id: paid_or_set_off
    element_zh: 价款已经支付，或者已依法抵销（抵销通知到达对方时生效）
    element_en: The price was paid or validly set off (notice effective on arrival)
    burden: respondent
    stage: extinguished
    evidence_hints: [付款凭证, 银行流水, 抵销通知及送达证据]
    authority:
      - source: 《中华人民共和国民法典》
        pinpoint: 第五百五十七条
      - source: 《中华人民共和国民法典》
        pinpoint: 第五百六十八条
  - id: limitation
    element_zh: 诉讼时效已经届满
    element_en: The limitation period has expired
    burden: respondent
    stage: exercisable
    evidence_hints: [付款期限届满时点, 无催款/对账/还款承诺的时间线]
    authority:
      - source: 《中华人民共和国民法典》
        pinpoint: 第一百八十八条

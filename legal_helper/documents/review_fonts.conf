<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Open stand-ins for the GB fonts, for REVIEW RENDERS ONLY.

  legal_helper names the GB fonts in every Chinese DOCX it writes (仿宋, 黑体,
  楷体, 宋体, 方正小标宋简体): those are what the reader's Word or WPS has, and
  GB/T 9704 asks for them by name. The render host usually has none of them,
  and fontconfig's default answer for an unknown family is DejaVu Sans — so
  every role used to come out in the same fallback face and a contact sheet
  could not show which line was a 黑体 heading and which 仿宋 body.

  legal_helper.documents.review_fonts passes this file to soffice as
  FONTCONFIG_FILE for page renders. Nothing else reads it: the user's own
  fontconfig and caches are untouched, and the DOCX keeps the GB names. Every
  stand-in is an <accept>, appended after the requested family, so a host that
  does have the real font still uses it.

  The Mac family names that gongwen-gbt9704-skill writes when the GB fonts are
  missing (STFangsong, Songti SC, …) are mapped too, so its output reviews the
  same way.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- Song and FangSong roles: a Ming/Song serif. -->
  <alias binding="same">
    <family>仿宋</family>
    <accept><family>Noto Serif CJK SC</family><family>Source Han Serif SC</family><family>AR PL UMing CN</family></accept>
  </alias>
  <alias binding="same">
    <family>仿宋_GB2312</family>
    <accept><family>Noto Serif CJK SC</family><family>Source Han Serif SC</family><family>AR PL UMing CN</family></accept>
  </alias>
  <alias binding="same">
    <family>FangSong</family>
    <accept><family>Noto Serif CJK SC</family><family>Source Han Serif SC</family><family>AR PL UMing CN</family></accept>
  </alias>
  <alias binding="same">
    <family>FangSong_GB2312</family>
    <accept><family>Noto Serif CJK SC</family><family>Source Han Serif SC</family><family>AR PL UMing CN</family></accept>
  </alias>
  <alias binding="same">
    <family>STFangsong</family>
    <accept><family>Noto Serif CJK SC</family><family>Source Han Serif SC</family><family>AR PL UMing CN</family></accept>
  </alias>
  <alias binding="same">
    <family>宋体</family>
    <accept><family>Noto Serif CJK SC</family><family>Source Han Serif SC</family><family>AR PL UMing CN</family></accept>
  </alias>
  <alias binding="same">
    <family>SimSun</family>
    <accept><family>Noto Serif CJK SC</family><family>Source Han Serif SC</family><family>AR PL UMing CN</family></accept>
  </alias>
  <alias binding="same">
    <family>Songti SC</family>
    <accept><family>Noto Serif CJK SC</family><family>Source Han Serif SC</family><family>AR PL UMing CN</family></accept>
  </alias>
  <alias binding="same">
    <family>STSong</family>
    <accept><family>Noto Serif CJK SC</family><family>Source Han Serif SC</family><family>AR PL UMing CN</family></accept>
  </alias>
  <alias binding="same">
    <family>华文中宋</family>
    <accept><family>Noto Serif CJK SC</family><family>Source Han Serif SC</family><family>AR PL UMing CN</family></accept>
  </alias>

  <!-- Kai role. No open Kai face is installed here, so it shares the serif;
       AR PL UKai is preferred where it exists. -->
  <alias binding="same">
    <family>楷体</family>
    <accept><family>AR PL UKai CN</family><family>Noto Serif CJK SC</family><family>Source Han Serif SC</family></accept>
  </alias>
  <alias binding="same">
    <family>楷体_GB2312</family>
    <accept><family>AR PL UKai CN</family><family>Noto Serif CJK SC</family><family>Source Han Serif SC</family></accept>
  </alias>
  <alias binding="same">
    <family>KaiTi</family>
    <accept><family>AR PL UKai CN</family><family>Noto Serif CJK SC</family><family>Source Han Serif SC</family></accept>
  </alias>
  <alias binding="same">
    <family>KaiTi_GB2312</family>
    <accept><family>AR PL UKai CN</family><family>Noto Serif CJK SC</family><family>Source Han Serif SC</family></accept>
  </alias>
  <alias binding="same">
    <family>STKaiti</family>
    <accept><family>AR PL UKai CN</family><family>Noto Serif CJK SC</family><family>Source Han Serif SC</family></accept>
  </alias>
  <alias binding="same">
    <family>Kaiti SC</family>
    <accept><family>AR PL UKai CN</family><family>Noto Serif CJK SC</family><family>Source Han Serif SC</family></accept>
  </alias>

  <!-- Hei role: a sans. -->
  <alias binding="same">
    <family>黑体</family>
    <accept><family>Noto Sans CJK SC</family><family>Source Han Sans SC</family><family>WenQuanYi Zen Hei</family></accept>
  </alias>
  <alias binding="same">
    <family>SimHei</family>
    <accept><family>Noto Sans CJK SC</family><family>Source Han Sans SC</family><family>WenQuanYi Zen Hei</family></accept>
  </alias>
  <alias binding="same">
    <family>微软雅黑</family>
    <accept><family>Noto Sans CJK SC</family><family>Source Han Sans SC</family><family>WenQuanYi Zen Hei</family></accept>
  </alias>
  <alias binding="same">
    <family>Microsoft YaHei</family>
    <accept><family>Noto Sans CJK SC</family><family>Source Han Sans SC</family><family>WenQuanYi Zen Hei</family></accept>
  </alias>
  <alias binding="same">
    <family>Heiti SC</family>
    <accept><family>Noto Sans CJK SC</family><family>Source Han Sans SC</family><family>WenQuanYi Zen Hei</family></accept>
  </alias>
  <alias binding="same">
    <family>STHeiti</family>
    <accept><family>Noto Sans CJK SC</family><family>Source Han Sans SC</family><family>WenQuanYi Zen Hei</family></accept>
  </alias>

  <!-- Office's default faces. 等线 (DengXian) is the default of a Chinese
       Excel or Word file and Calibri/Cambria of an English one; none is on
       the host, and DejaVu Sans, the fallback, is wide enough that a ledger
       whose amounts fit in Excel previewed as "###" with every text column
       clipped. Carlito and Caladea are metric-compatible where installed;
       Liberation is the closest face otherwise. -->
  <alias binding="same">
    <family>等线</family>
    <accept><family>Noto Sans CJK SC</family><family>Source Han Sans SC</family><family>WenQuanYi Zen Hei</family></accept>
  </alias>
  <alias binding="same">
    <family>DengXian</family>
    <accept><family>Noto Sans CJK SC</family><family>Source Han Sans SC</family><family>WenQuanYi Zen Hei</family></accept>
  </alias>
  <alias binding="same">
    <family>等线 Light</family>
    <accept><family>Noto Sans CJK SC</family><family>Source Han Sans SC</family><family>WenQuanYi Zen Hei</family></accept>
  </alias>
  <alias binding="same">
    <family>Calibri</family>
    <accept><family>Carlito</family><family>Liberation Sans</family></accept>
  </alias>
  <alias binding="same">
    <family>Calibri Light</family>
    <accept><family>Carlito</family><family>Liberation Sans</family></accept>
  </alias>
  <alias binding="same">
    <family>Cambria</family>
    <accept><family>Caladea</family><family>Liberation Serif</family></accept>
  </alias>

  <!-- Xiaobiaosong (the 公文 title face) is a heavy Song: the bold serif. -->
  <match target="pattern">
    <test name="family" qual="any"><string>方正小标宋简体</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Serif CJK SC</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>方正小标宋_GBK</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Serif CJK SC</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>FZXiaoBiaoSong-B05S</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Serif CJK SC</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
</fontconfig>

# Aviation treaty corpus — per-file metadata + source URLs.
#
# fetch_aviation_corpus.sh reads source_url and downloads into `file`.
# rag/ingest.py reads every other key and tags each chunk with it so
# retrieve_legal can filter by treaty_name / language / etc.
#
# URLs verified May 2026. The fetch script rejects non-PDF responses
# (magic-byte check), so dead URLs surface as BADPDF in the log. Update
# this manifest when a source moves, then re-run the fetch.
treaty_corpus_version: "2026-05-13"

files:
  # ── Chicago Convention 1944 — ICAO Doc 7300 (9th ed) ─────────────
  - file: en/chicago_1944_doc7300_9ed.pdf
    treaty_name: "Chicago Convention"
    short_id: "chicago_1944"
    language: "en"
    jurisdiction: "ICAO"
    cite_prefix: "Chicago Convention"
    authentic_text: true
    source_url: "https://www.icao.int/sites/default/files/2024-12/7300_9ed.pdf"

  # ── Tokyo Convention 1963 — UN db/terrorism collection ────────────

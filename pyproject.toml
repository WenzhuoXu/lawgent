[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-helper"
version = "0.1.0"
description = "Lawgent — open-source legal AI agent: grounded, multi-jurisdiction, citation-verified (Claude + GPT)"
requires-python = ">=3.10"
authors = [{ name = "Lawgent contributors" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.101",
    "openai>=2.36",
    "pydantic>=2",
    "python-docx>=1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "XlsxWriter>=3.2.9",
    "formulas>=1.3",
    "mammoth>=1.11",
    "firecrawl-anydoc>=0.1.6",
    "markitdown[all]>=0.1.5",
    "Pillow>=12",
    "pi-heif>=1.0",
    "weasyprint>=68",
    "markdown>=3.10",
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "loguru>=0.7",
    "fastapi>=0.136",
    "uvicorn[standard]>=0.46",
    "python-multipart>=0.0.28",
    "python-dotenv>=1.2",
    "pdfminer.six",
    "pdfplumber>=0.11.9",
    "pypdf>=6.11",
    "pypdfium2>=5.8",
    "rapidocr>=3.9",
    "onnxruntime>=1.20",
    "ooxml-integrity>=0.5,<0.6",
    "pikepdf>=10.6",
    "reportlab>=4.5",
    "pdf2image>=1.17",
    "chinesecalendar>=1.11.0",
    "jinja2",
    "rich",
    "pyyaml",
    "httpx",
]

[project.scripts]
legal-helper = "legal_helper.cli:main"

[tool.setuptools.packages.find]
include = ["legal_helper*"]

[tool.setuptools.package-data]
legal_helper = [
    "skills/**/*.md",
    "documents/review_fonts.conf",
    "playbook/format_recipes/*.md",
    "playbook/*.md",
    "webui/*.html",
    "webui/*.js",
    "webui/*.css",
]

[tool.pytest.ini_options]
markers = [
    "live: hits real provider APIs; opt-in via env var",
]
asyncio_mode = "auto"
